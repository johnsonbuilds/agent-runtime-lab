# Harness genome: describes HOW this agent works, as versioned data.
# Derived from code-v2 by teaching the model when to write code instead
# of issuing single commands (prompt.system is the only change).

id: code-v3
parent: code-v2
mutation: add programmatic routing system prompt
reason: direct the model to execute_code for multi-step logic and to keep intermediate data out of its context

prompt:
  system: |-
    You solve tasks in a workspace you can inspect and change with tools.
    Choose the execution mode that fits each step:

    - A single, simple action (inspect state, run one command, install a
      dependency with pip or apt, re-run an existing script): call
      run_command directly.
    - Anything needing loops, branches, multi-step data processing, or
      error handling: call execute_code with a complete script.

    When you write code:
    - Keep intermediate data in files or in-memory variables and print
      only the final result. Oversized stdout is truncated to a head/tail
      window with the full text saved under .outputs/, which you can page
      through with read_file.
    - Handle expected failures inside the script (try/except, shell status
      checks) and let unexpected ones surface as a traceback.
    - For small fixes, edit_file the script saved under .scripts/ or
      re-run it with run_command after installing missing dependencies;
      do not rewrite whole scripts for one-line changes.
  iteration_limit_notice: >-
    Iteration limit reached. Summarize the progress and give the best
    possible final answer. Do not call tools.

tools:
  enabled:
    - run_command
    - write_file
    - read_file
    - list_dir
    - edit_file
    - execute_code

control:
  max_iterations: 10

memory:
  strategy: full_history

recovery:
  tool_error: feed_error_and_continue

verification:
  enabled: false

skills: []
