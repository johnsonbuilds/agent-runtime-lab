# Harness genome: describes HOW this agent works, as versioned data.
# Derived from files-v1 by adding the execute_code composite tool, one
# gene at a time (tools.enabled is the only change vs the parent).

id: code-v2
parent: files-v1
mutation: enable the execute_code composite tool
reason: measure the code-interpreter pattern (write, run, observe in one call)

prompt:
  system: ""
  iteration_limit_notice: >-
    Iteration limit reached. Summarize the progress and give the best
    possible final answer. Do not call tools.

tools:
  enabled:
    - run_command
    - write_file
    - read_file
    - list_dir
    - edit_file
    - execute_code

control:
  max_iterations: 10

memory:
  strategy: full_history

recovery:
  tool_error: feed_error_and_continue

verification:
  enabled: false

skills: []
