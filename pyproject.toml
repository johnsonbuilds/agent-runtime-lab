[project]
name = "agent-loop-practice"
version = "0.1.0"
description = "Small, composable exercises for learning agent systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
agent-practice = "run_agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_practice"]
